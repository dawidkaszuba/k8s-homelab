- name: ensure required dependencies are installed
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: download Docker official GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true

- name: add Docker repository to Apt sources
  apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ debian_codename }} stable"
    state: present
    filename: docker
    update_cache: true

- name: install containerd.io package
  apt:
    name: containerd.io
    state: present

- name: ensure containerd service is started and enabled
  systemd:
    name: containerd
    state: started
    enabled: true

- name: ensure containerd configuration directory exists
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: generate default containerd configuration in memory
  command: containerd config default
  register: default_containerd_config
  changed_when: false


- name: write configuration file
  copy:
    content: "{{ default_containerd_config.stdout | regex_replace('^(\\s*)SystemdCgroup = false$', 'SystemdCgroup = true', multiline=True) }}"
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: Restart containerd
