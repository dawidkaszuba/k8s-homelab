- name: ensure required dependencies are installed
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: download Kubernetes official GPG key
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: '0644'
    force: true

- name: add Kubernetes repository to Apt sources
  apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /"
    state: present
    filename: kubernetes

- name: install kubelet package
  apt:
    name: "kubelet={{ kubernetes_version }}"
    state: present

- name: prevent kubelet from being automatically upgraded
  dpkg_selections:
    name: kubelet
    selection: hold

- name: install kubeadm package
  apt:
    name: "kubeadm={{ kubernetes_version }}"
    state: present

- name: prevent kubeadm from being automatically upgraded
  dpkg_selections:
    name: kubeadm
    selection: hold

- name: install kubectl package
  apt:
    name: "kubectl={{ kubernetes_version }}"
    state: present

- name: prevent kubectl from being automatically upgraded
  dpkg_selections:
    name: kubectl
    selection: hold

